services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarthvac
      POSTGRES_USER: smarthvac
      POSTGRES_PASSWORD: smarthvac
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthvac -d smarthvac"]
      interval: 5s
      timeout: 5s
      retries: 12
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://smarthvac:smarthvac@postgres:5432/smarthvac
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      CORS_ORIGINS: http://localhost:5173
      DEMO_MODE: ${DEMO_MODE:-true}
      MQTT_BROKER: mqtt
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
